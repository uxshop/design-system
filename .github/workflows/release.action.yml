name: 'Publish NPM'

on:
  release:
    types: [published]
  workflow_dispatch: # temporário

permissions:
  id-token: write  # Required for OIDC
  contents: read

env:
  NODE_VERSION: 22.x
  HUSKY: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Debug auth
        run: |
          echo "=== .npmrc ==="
          cat ~/.npmrc || echo "no ~/.npmrc"
          echo "=== npm config ==="
          npm config list
          echo "=== npm whoami ==="
          npm whoami --registry https://registry.npmjs.org || echo "not authenticated"
    
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
      - uses: actions/upload-artifact@v7
        with:
          name: ds-build
          path: dist/
